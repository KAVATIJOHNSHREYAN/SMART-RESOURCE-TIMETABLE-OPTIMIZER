version: '3.8'

services:
  db:
    image: postgres:15
    container_name: srto-db
    environment:
      POSTGRES_USER: srto_user
      POSTGRES_PASSWORD: srto_password
      POSTGRES_DB: srto_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: srto-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: srto-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://srto_user:srto_password@db:5432/srto_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: srto-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
